<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!--
  MedTruad · หน้าห่อบน GitHub Pages (B1)
  หน้าที่: ชื่อ/ไอคอนบนหน้าจอโฮม · splash ระหว่าง Apps Script โหลด · ส่ง ?k= ต่อให้แอป
  แก้ไฟล์นี้จุดเดียว: ค่า EXEC ด้านล่าง (URL /exec ของ deployment)
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedTruad · เม็ดตรวจ</title>
<meta name="description" content="ฝึก long case อายุรกรรมกับคนไข้ AI">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="origin">
<meta name="theme-color" content="#F2F3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedTruad">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #F2F3F7; --card: #FFFFFF; --ink: #151826; --ink-2: #565B70; --ink-3: #6B7086; --accent: #5653D4;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'IBM Plex Sans Thai', 'Sukhumvit Set', 'Thonburi', system-ui, sans-serif; color: var(--ink); -webkit-text-size-adjust: 100%; }
  /* แอปใน iframe มองไม่เห็นขอบจอ (safe area = 0) → หน้าห่อเว้นขอบให้เอง
     ขอบล่างเป็นสีขาวเมื่อแอปแสดงแถบแท็บ (แอปส่ง medtruad:tabs:1 มา) ไม่งั้นสีพื้น */
  #app { position: fixed; left: 0; right: 0; top: var(--sat); bottom: var(--sab); width: 100%; height: calc(100% - var(--sat) - var(--sab)); border: 0; display: block; background: var(--bg); }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: var(--sab); background: var(--bg); }
  body.tabs #pad { background: var(--card); }
  #splash { position: fixed; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: var(--sat) 24px var(--sab); transition: opacity .28s ease; }
  body.ready #splash { opacity: 0; pointer-events: none; }
  body.gone #splash { display: none; }
  #splash svg { width: 76px; height: 76px; }
  #splash .dot { transform-origin: 49px 32px; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.8); opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { #splash .dot { animation: none; } #splash { transition: none; } }
  .credit { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 22px); text-align: center; font-size: 12px; color: var(--ink-3); letter-spacing: .01em; }
  .credit b { color: var(--ink-2); font-weight: 600; }
  #slow { margin-top: 26px; max-width: 300px; text-align: center; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
  #slow a { display: inline-block; margin: 10px 6px 0; padding: 9px 16px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  #slow a.ghost { background: transparent; color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="splash" role="status" aria-label="กำลังเปิด MedTruad">
  <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#151826" stroke-width="7" stroke-linecap="round"><path d="M11 15C24 15 26 32 35 32"/><path d="M11 49C24 49 26 32 35 32"/><path d="M11 32H35"/></g><circle class="dot" cx="49" cy="32" r="8.5" fill="#5653D4"/></svg>
  <div id="slow" hidden></div>
  <noscript><p style="margin-top:24px;color:#565B70">เปิด JavaScript ก่อนใช้แอป</p></noscript>
  <div class="credit"><b>MediMao</b> by ChiepzzGolf</div>
</div>
<iframe id="app" title="MedTruad" allow="clipboard-write; clipboard-read" referrerpolicy="origin"></iframe>
<div id="pad"></div>
<script>
  /* ใส่ URL /exec ของ deployment (Deploy → Manage deployments → Web app URL) */
  var EXEC = 'https://script.google.com/macros/s/AKfycbwT2gFpDRCuIJmVMTHbXNWYXEaKOmdHyx8oFDj_S4Bzz9SK9TDlZzYEfsfHZXB183ylWg/exec';

  var app = document.getElementById('app');
  var slow = document.getElementById('slow');
  var body = document.body;
  var done = false;

  /* B1.1 หน้าห่อเป็นคนจำรหัส: Safari ล้างที่เก็บของแอปใน iframe ทุกครั้งที่ปิด จึงต้องจำไว้ที่ github.io แทน
     mt.token = รหัสล่าสุดที่แอปส่งมา ('-' = ออกจากระบบแล้ว) · mt.urlk = ?k= ล่าสุดที่เห็นใน URL
     ลำดับ: ?k= ใหม่ใน URL (เพิ่งสร้างลิงก์) → รหัสที่จำไว้ → ?k= เดิมใน URL → ไม่มี (หน้าเข้าใช้) */
  var HEX = /^[0-9a-f]{64}$/;
  function lsGet(n) { try { return localStorage.getItem(n) || ''; } catch (e) { return ''; } }
  function lsSet(n, v) { try { if (v) localStorage.setItem(n, v); else localStorage.removeItem(n); } catch (e) { /* โหมดส่วนตัว */ } }
  var urlK = new URLSearchParams(location.search).get('k') || '';
  if (!HEX.test(urlK)) urlK = '';
  var saved = lsGet('mt.token');
  var use = '';
  if (urlK && urlK !== lsGet('mt.urlk')) { use = urlK; lsSet('mt.urlk', urlK); lsSet('mt.token', urlK); }
  else if (HEX.test(saved)) use = saved;
  else if (saved !== '-') use = urlK;
  var key = use ? '&k=' + use : '';

  /* B1.2: ?debug=1 → แถบเล็กมุมล่างบอกว่าได้ข้อความจากแอปไหม · จำรหัสไว้หรือยัง (ใช้ตรวจบน iPhone) */
  var DBG = /[?&]debug=1(&|$)/.test(location.search);
  var dbgBox = null, dbgLog = [];
  function dbg(msg, ok, origin) {
    if (!DBG) return;
    if (!dbgBox) {
      dbgBox = document.createElement('pre');
      dbgBox.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:9;margin:0;padding:8px 10px;border-radius:10px;background:rgba(21,24,38,.88);color:#fff;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(dbgBox);
    }
    if (msg) dbgLog.push((ok ? '✓ ' : '✗ ') + msg + (ok ? '' : '  (' + origin + ')'));
    var t = lsGet('mt.token');
    dbgBox.textContent = 'MedTruad debug · ใช้รหัส: ' + (use ? 'มี (' + use.slice(0, 6) + '…)' : 'ไม่มี') + ' · จำไว้: ' + (HEX.test(t) ? t.slice(0, 6) + '…' : (t || 'ไม่มี')) + '\n' + dbgLog.slice(-6).join('\n');
  }
  var direct = EXEC + (use ? '?k=' + use : '');

  function ready() {
    if (done) return;
    done = true;
    body.classList.add('ready');
    setTimeout(function () { body.classList.add('gone'); }, 320);
  }
  function showSlow(msg) {
    slow.hidden = false;
    slow.innerHTML = msg + '<br><a href="">โหลดใหม่</a><a class="ghost" target="_top"></a>';
    var a = slow.querySelector('.ghost');
    a.textContent = 'เปิดลิงก์ตรง';
    a.href = direct;
  }

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(EXEC) && !window.__MT_TEST) {
    slow.hidden = false;
    slow.textContent = 'ผู้ดูแลยังไม่ได้ใส่ URL ของแอปในไฟล์ index.html (ค่า EXEC)';
  } else {
    /* ข้อความจากแอป · Apps Script ซ้อนแอปไว้ 3 ชั้น (script.google.com → googleusercontent sandboxFrame → userHtmlFrame)
       B1.2: ไล่ขึ้นทีละชั้นจนเจอ iframe ของเรา (อ่าน .parent ข้ามเว็บได้) + ต้องมาจากโดเมนของ Google หรือของ EXEC */
    var execOrigin = '';
    try { execOrigin = new URL(EXEC).origin; } catch (err) { execOrigin = ''; }
    function fromApp(e) {
      var o = String(e.origin || '');
      if (!(o === execOrigin || /^https:\/\/[a-z0-9-]+(-[a-z0-9-]+)*\.googleusercontent\.com$/.test(o) || window.__MT_TEST)) return false;
      var w = e.source;
      for (var i = 0; i < 6 && w; i++) {
        if (w === app.contentWindow) return true;
        var p = null;
        try { p = w.parent; } catch (err) { return false; }
        if (!p || p === w) return false;
        w = p;
      }
      return false;
    }
    window.addEventListener('message', function (e) {
      if (typeof e.data !== 'string' || e.data.indexOf('medtruad:') !== 0) return;
      var mine = fromApp(e);
      dbg(e.data.replace(/^(medtruad:token:)[0-9a-f]{58}/, '$1…'), mine, e.origin);
      if (!mine) return;
      if (e.data === 'medtruad:ready') ready();
      else if (e.data === 'medtruad:tabs:1') body.classList.add('tabs');
      else if (e.data === 'medtruad:tabs:0') body.classList.remove('tabs');
      else if (e.data.indexOf('medtruad:token:') === 0) {
        var t = e.data.slice(15);
        lsSet('mt.token', HEX.test(t) ? t : '-');
        dbg('', true);
      }
    });
    /* แอปรุ่นเก่าที่ไม่ส่งสัญญาณ: ซ่อน splash หลังหน้าโหลด 4 วินาที */
    app.addEventListener('load', function () { setTimeout(ready, 4000); });
    setTimeout(function () { if (!done) showSlow('เปิดช้ากว่าปกติ · เน็ตอาจช้า หรือ Google ยังไม่ตอบ'); }, 20000);
    app.src = EXEC + '?w=1&o=' + encodeURIComponent(location.origin) + key;
    if (DBG) window.addEventListener('load', function () { dbg('', true); });
  }
</script>
</body>
</html>
